site_name: Aeda
site_description: >-
  The robot-scripting SDK that powers the modulated_system supervisor/worker
  loop in TidyROS.
site_url: https://saimailau.com/aeda_docs/
repo_url: https://github.com/saimlau/aeda_docs
repo_name: saimlau/aeda_docs
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Concepts:
      - Overview: concepts/overview.md
      - Runtime architecture: concepts/runtime-architecture.md
  - API reference:
      - aeda.tools: api/tools.md
      - aeda.frame: api/frame.md
      - aeda.platform / log / cancel: api/platform.md
      - aeda.llm: api/llm.md
      - aeda.workspace: api/workspace.md
      - run_script + RunHandle: api/script.md
  - Examples:
      - Overview: examples/index.md
      - Hello, platform: examples/hello.md
      - LLM judgement loop: examples/judgement-loop.md
      - Room scan + collect: examples/room-scan-and-collect.md
      - Scan → cluster → capture: examples/scan-cluster-capture.md
  - Tool catalog:
      - All tools (A–Z): tools/index.md
      - Perception: tools/perception.md
      - Navigation: tools/navigation.md
      - Manipulator: tools/manipulator.md
      - Trajectory: tools/trajectory.md
      - Recording: tools/recording.md
      - Collection: tools/collection.md
      - Data: tools/data.md
      - Data analysis: tools/data_analysis.md
      - Meta: tools/meta.md
  - Modules:
      - Overview: modules/index.md
      - Core primitives: modules/core.md
      - Lower level: modules/lower-level.md
      - LLM agents: modules/llm.md
      - Runtime + UI: modules/runtime.md
  - Guides:
      - Writing a tool: guides/writing-a-tool.md
      - Running a script: guides/running-a-script.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Pengyu-Mo/tidyros_iphone
      name: Aeda source (in tidyros_iphone)
    - icon: fontawesome/brands/github
      link: https://github.com/saimlau/aeda_docs
      name: This documentation site

copyright: >
  © 2026 TidyROS contributors — documentation licensed under Apache-2.0.
